{% extends "base.html" %}

{% block content %}
<style>
    .home-section {
        margin-bottom: 26px;
        padding: 20px 22px 24px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow);
    }
    .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 0 0 14px;
    }
    .section-heading h2 { margin: 0; color: var(--blue); font-size: 19px; font-weight: 800; }
    .section-heading h2::first-letter { color: var(--blue); }
    .refresh-note { color: var(--green); font-size: 13px; font-weight: 700; white-space: nowrap; }
    #shelterMap { height: 330px; overflow: hidden; border-radius: 9px; }
    .weather-content {
        min-height: 132px;
        padding: 14px 16px;
        border-radius: 8px;
        background: #f8fafc;
        color: #63738b;
        font-size: 13px;
    }
    .weather-content p { margin: 5px 0; }
    .weather-content .area { color: #53657f; font-weight: 700; }
    .weather-content .clear { color: var(--green); font-weight: 800; }
    .weather-content .warning { color: #d35a3a; font-weight: 700; }
    @media (max-width: 600px) {
        .home-section { padding: 16px; }
        .section-heading { align-items: flex-start; flex-direction: column; gap: 2px; }
        .section-heading h2 { font-size: 17px; }
        #shelterMap { height: 270px; }
    }
</style>

<section class="home-section" aria-labelledby="map-title">
    <div class="section-heading">
        <h2 id="map-title">● 避難所マップ</h2>
    </div>
    <div id="shelterMap" aria-label="避難所の地図"></div>
</section>

<section class="home-section" aria-labelledby="weather-title">
    <div class="section-heading">
        <h2 id="weather-title">☁ 青森市 気象警報・注意報</h2>
        <span class="refresh-note">↻ 10分おき自動更新</span>
    </div>
    <div class="weather-content" id="weatherContent">
        <p>気象情報を読み込み中...</p>
    </div>
</section>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
        const map = L.map('shelterMap').setView([40.8244, 140.7400], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        fetch('/shelters')
                .then(response => response.ok ? response.json() : [])
                .then(shelters => shelters.forEach(shelter => {
                        if (shelter.latitude && shelter.longitude) {
                                L.marker([shelter.latitude, shelter.longitude])
                                        .addTo(map)
                                        .bindPopup(shelter.name);
                        }
                }))
                .catch(() => {});

        function updateWeatherWarnings() {
                fetch('/api/weather_warnings')
                        .then(response => response.json())
                        .then(updateWeatherContent)
                        .catch(() => {
                                document.getElementById('weatherContent').innerHTML = '<p>気象情報の取得に失敗しました</p>';
                        });
        }

        function updateWeatherContent(data) {
                const weatherContent = document.getElementById('weatherContent');
                if (data.error) {
                        weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
                        return;
                }

                const hasWarnings = data.warnings && data.warnings.length > 0;
                const warningHtml = hasWarnings
                        ? data.warnings.map(warning => `<p class="warning">⚠ ${warning.name}（${warning.status}）</p>`).join('')
                        : '<p class="clear">● 現在、警報・注意報は発表されていません</p>';

                weatherContent.innerHTML = `
                        <p class="area">● ${data.area_name || '青森市'}</p>
                        ${warningHtml}
                        <p>◷ データ取得: ${data.last_fetch_time || '更新中...'}</p>
                        <p>⌁ 気象庁発表: ${data.report_time || '不明'}</p>
                `;
        }

        updateWeatherWarnings();
        setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
