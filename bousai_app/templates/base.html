<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #2559ad;
      --blue-dark: #17458f;
      --ink: #1c2f4c;
      --muted: #6f7d91;
      --line: #e6ebf2;
      --surface: #ffffff;
      --page: #f5f8fc;
      --green: #269b57;
      font-family: "Noto Sans JP", sans-serif;
      color: var(--ink);
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); }
    .site-header {
      position: relative;
      z-index: 1000;
      height: 70px;
      background: linear-gradient(110deg, var(--blue-dark), var(--blue));
      color: #fff;
      box-shadow: 0 2px 10px rgba(24, 57, 109, .16);
    }
    .header-inner {
      width: min(1120px, calc(100% - 40px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { color: #fff; text-decoration: none; font-size: 22px; font-weight: 800; letter-spacing: .04em; }
    .menu-button {
      border: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 25px;
      line-height: 1;
      padding: 10px;
    }
    .menu-panel {
      display: none;
      position: absolute;
      z-index: 20;
      right: max(20px, calc((100% - 1120px) / 2));
      top: 70px;
      width: 225px;
      padding: 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(32, 55, 92, .18);
    }
    .menu-panel.is-open { display: grid; }
    .menu-panel a { padding: 11px 12px; color: var(--ink); text-decoration: none; border-radius: 5px; }
    .menu-panel a:hover { background: #eef4ff; color: var(--blue); }
    .menu-status { padding: 10px 12px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
    main { min-height: calc(100vh - 70px); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">防災アプリ</a>
      <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-menu">☰</button>
    </div>
    <nav id="site-menu" class="menu-panel" aria-label="メインメニュー">
      <a href="/">ホーム</a>
      <a href="/shelter_search">避難所検索</a>
      <a href="/shelter_register">避難所登録</a>
      <a href="/board">指示・発信ボード</a>
      <div class="menu-status">
        {% if session.logged_in %}
          ログイン中{% if session.username %}（{{ session.username }}）{% endif %} · <a href="/logout">ログアウト</a>
        {% else %}
          未ログイン · <a href="/login">ログイン</a>
        {% endif %}
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    const menuButton = document.querySelector('.menu-button');
    const siteMenu = document.querySelector('#site-menu');
    menuButton?.addEventListener('click', () => {
      const isOpen = siteMenu.classList.toggle('is-open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.setAttribute('aria-label', isOpen ? 'メニューを閉じる' : 'メニューを開く');
      menuButton.textContent = isOpen ? '×' : '☰';
    });
  </script>
</body>
</html>
